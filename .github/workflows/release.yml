name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: solix-linux-x86_64
            archive_name: solix-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: solix-macos-arm64
            archive_name: solix-macos-arm64.tar.gz
          - os: windows-latest
            artifact_name: solix-windows-x64
            archive_name: solix-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libspdlog-dev libfmt-dev ninja-build rpm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install spdlog fmt ninja

      - name: Configure CMake (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package with CPack (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cd build
          cpack -C Release

      - name: Package with CPack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build
          cpack -C Release

      - name: Upload CPack packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.pkg
            build/*.exe
            build/*.zip
          if-no-files-found: warn

      - name: Upload VS Code extension
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: solix-vscode-extension
          path: editors/vscode/solix-*.vsix
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '' }}
