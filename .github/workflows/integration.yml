name: Continuous Integration

on:
  push:
    branches: [ master, main, "feature-*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            c: gcc
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            c: clang
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++
            c: clang
          - os: windows-latest
            compiler: clang
            cxx: clang++
            c: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libspdlog-dev libfmt-dev ninja-build \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install spdlog fmt ninja

      - name: Configure CMake (Linux & macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.c }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        env:
          CC: ${{ matrix.c }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_STANDARD=20

      - name: Build
        env:
          CC: ${{ matrix.c }}
          CXX: ${{ matrix.cxx }}
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        env:
          CC: ${{ matrix.c }}
          CXX: ${{ matrix.cxx }}
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  sanitizers:
    name: Linux ASan/UBSan (gcc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libspdlog-dev libfmt-dev ninja-build

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DCMAKE_CXX_STANDARD=20

      - name: Build with Sanitizers
        run: cmake --build build-asan --parallel

      - name: Run Tests under Sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:symbolize=1"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: ctest --test-dir build-asan --output-on-failure --timeout 180
